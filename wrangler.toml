name = "agentchicago17b"
main = "workers/api/src/index.ts"
compatibility_date = "2026-03-01"
compatibility_flags = ["nodejs_compat"]
account_id = "67a17ada4efeee4480283035cc0c5f90"
workers_dev = true
preview_urls = true


# SPA from `npm run build` (vite → dist)
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "agentchicago17b"
database_id = "22d2cc95-6413-4678-ba87-21eb9a461b1f"
migrations_dir = "workers/api/migrations"

[[kv_namespaces]]
binding = "CACHE"
id = "ed1e16bfe0d6410abc32c4fe676e8f8c"

[[r2_buckets]]
binding = "BLOBS"
bucket_name = "agentchicago17b-blobs"

[[vectorize]]
binding = "VECTORS"
index_name = "agentchicago17b-rag"

[ai]
binding = "AI"

[vars]
AUTH_MODE = "access-code"
WORKSPACE_ID = "ws_default"
WORKSPACE_NAME = "AgentChicago17B"

# Secrets (set via `wrangler secret put` or chicago configure):
# ACCESS_CODE
# CF_API_TOKEN / OPENROUTER_API_KEY / NVIDIA_API_KEY
# CF_ACCESS_TEAM_DOMAIN / CF_ACCESS_AUD
# OAUTH_CLIENT_ID / OAUTH_CLIENT_SECRET
