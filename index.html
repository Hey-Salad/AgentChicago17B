<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        var t = localStorage.getItem('agentchicago-theme')
        if (t !== 'light' && t !== 'dark') t = 'dark'
        document.documentElement.setAttribute('data-theme', t)
        document.documentElement.style.backgroundColor = t === 'light' ? '#ffd0cd' : '#000000'
      } catch (e) {
        document.documentElement.style.backgroundColor = '#000000'
      }
    </script>
    <style>
      html,
      body {
        margin: 0;
        background: #000000;
      }
      html[data-theme='light'],
      html[data-theme='light'] body {
        background: #ffd0cd;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/brand/mark-color.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AgentChicago17B — HeySalad open-source desk research agent. Deep briefs, Chicago style."
    />
    <meta name="theme-color" content="#ed4c4c" />
    <title>AgentChicago17B</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
